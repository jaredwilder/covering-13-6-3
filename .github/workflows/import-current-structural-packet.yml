name: One-shot C13 structural packet import
on:
  push:
    paths:
      - '.github/workflows/import-current-structural-packet.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import current public structural packet
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/jaredwilder/combinatorial-records.git "$tmp/source"
          mkdir -p research/current-structural-packet
          cp -a "$tmp/source/covering-designs/C13-6-3/." research/current-structural-packet/
          rm -f .github/workflows/import-current-structural-packet.yml
          git config user.name "jaredwilder"
          git config user.email "jared@jaredwilder.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import current C13 structural packet"
          git push origin HEAD:master
